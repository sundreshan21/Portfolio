# Render Blueprint — Static Site (recommended)
# Dashboard: New → Static Site → Connect sundreshan21/Portfolio
# Or: New → Blueprint → apply this file

services:
  - type: web
    name: portfolio
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
